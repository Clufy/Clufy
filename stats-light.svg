<svg xmlns="http://www.w3.org/2000/svg" width="420" height="206" viewBox="0 0 420 206" role="img" aria-label="GitHub activity"><title>GitHub activity</title><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}.m{fill:#59636e}.n{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}.row{opacity:0;animation:in .5s ease-out forwards}@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) forwards;transform:scaleX(0)}@keyframes grow{to{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.row,.bar{animation:none;opacity:1;transform:none}}</style><rect x=".5" y=".5" width="419" height="205" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="24" y="26" width="28" height="4" rx="2" fill="#0969da"/><text x="24" y="54" style="font-size:17px;font-weight:800">GitHub activity</text><g class="row" style="animation-delay:0.00s"><text x="24" y="92" class="m" style="font-size:14px">Contributions (last year)</text><text x="396" y="92" text-anchor="end" class="n" style="font-size:15px">2,445</text></g><g class="row" style="animation-delay:0.12s"><text x="24" y="122" class="m" style="font-size:14px">Commits (last year)</text><text x="396" y="122" text-anchor="end" class="n" style="font-size:15px">2,440</text></g><g class="row" style="animation-delay:0.24s"><text x="24" y="152" class="m" style="font-size:14px">Public repositories</text><text x="396" y="152" text-anchor="end" class="n" style="font-size:15px">10</text></g><g class="row" style="animation-delay:0.36s"><text x="24" y="182" class="m" style="font-size:14px">Stars earned</text><text x="396" y="182" text-anchor="end" class="n" style="font-size:15px">1</text></g></svg>